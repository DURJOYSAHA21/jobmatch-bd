# Render Blueprint — connect this repo in the Render dashboard
# and apply this file, or create a Web Service manually with the same settings.
services:
  - type: web
    name: jobmatch-bd-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: DEFAULT_MATCH_LIMIT
        value: "20"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: MATCH_EMAIL_THRESHOLD
        value: "50"
      - key: PYTHON_VERSION
        value: "3.11.9"
